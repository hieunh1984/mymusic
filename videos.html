<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Videos nhạc — Âm nhạc không biên giới</title>
<link rel="stylesheet" href="styles.css">
<script src="common.js" defer></script>
</head>
<body>
<div class="container">
<div class="topbar">
<h2>Videos nhạc</h2>
<div><a class="btn" href="index.html">← Về trang chính</a></div>
</div>


<div class="player">
<video id="mainVideo" width="100%" controls style="border-radius:10px;background:black"></video>
<div class="playlist" id="videoList"></div>
</div>
</div>


<script>
const videos = [
{title:'Video Mẫu 1',src:'media/video1.mp4'},
{title:'Video Mẫu 2',src:'media/video2.mp4'}
];
const mainVideo = document.getElementById('mainVideo');
const videoList = document.getElementById('videoList');
videos.forEach((v,i)=>{
const el = document.createElement('div'); el.className='track'; el.innerHTML = `<div><div class="title">${v.title}</div><div class="meta">${v.src}</div></div><div>▶</div>`;
el.addEventListener('click',()=>{mainVideo.src=v.src; mainVideo.play(); qa('.track').forEach(x=>x.classList.remove('active')); el.classList.add('active')}); videoList.appendChild(el);
});
// play first
if(videos.length) { mainVideo.src = videos[0].src; qa('.track')[0].classList.add('active') }
function qa(sel){return Array.from(document.querySelectorAll(sel))}
</script>
</body>
</html>
