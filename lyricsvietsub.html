<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nhạc lyrics + vietsub — Âm nhạc không biên giới</title>
<link rel="stylesheet" href="css/lyricsvietsub.css">
<script src="common.js" defer></script>
<script src="js/lyricsvietsub.js" defer></script>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h2>Nhạc lyrics + vietsub</h2>
    <div><a class="btn" href="index.html">← Về trang chính</a></div>
  </div>

  <div class="player" id="playerBox">
    <video id="videoPlayer" width="100%" controls style="display:none;border-radius:10px;background:black"></video>
    <audio id="audioPlayer" controls style="display:none;width:100%"></audio>

    <div class="controls">
      <button class="btn" id="prevBtn">Prev</button>
      <button class="btn" id="playBtn">Play</button>
      <button class="btn" id="pauseBtn">Pause</button>
      <button class="btn" id="nextBtn">Next</button>
      <button class="btn" id="replayBtn">Nghe lại</button>
      <button class="btn" id="seqBtn">Tuần tự</button>
      <button class="btn" id="shfBtn">Ngẫu nhiên</button>
    </div>

    <div class="meta-row">
      <div class="meta">Bài hiện tại: <strong id="currentTitle">—</strong></div>
      <div class="meta">Trạng thái: <span id="status">idle</span></div>
    </div>

    <div class="lyrics-box" id="lyricsBox">Chưa có lời...</div>
    <div class="playlist" id="playlist"></div>
  </div>
</div>
</body>
</html>
